uid: SR-0021
type: system_requirement
status: approved
title: Identify suppliers involved in each service
text: For each service, the internal and external suppliers involved in delivering the service shall be
  identified, including, as relevant, federation members. Their contact points, roles and responsibilities
  shall be determined.
